name: 'build'

# eink-qemu: branches always build; only plain version tags (0.1.0, 0.2.0-rc1)
# build a release. The tree also carries QEMU's own v* tags, which must not.
on:
  push:
    branches: [ '**' ]
    tags: [ '[0-9]+.[0-9]+.[0-9]+*' ]
  pull_request:

# eink-qemu: a newer push to the same branch or PR cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WASM_PAGES_BRANCH: main

jobs:

  Vars:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.Vars.outputs.VERSION }}
      PROJECT_NAME: ${{ steps.Vars.outputs.PROJECT_NAME }}
      REPOSITORY_URL: ${{ steps.Vars.outputs.REPOSITORY_URL }}
    steps:
      - id: Vars
        run: |
          echo "ref_type: ${{ github.ref_type }}"
          echo "ref: ${{ github.ref }}"
          echo "sha: ${{ github.sha }}"
          echo ""
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${{ github.ref }}
            VERSION=${VERSION#"refs/tags/"}
            VERSION=${VERSION//"-"/"_"}   # replace dashes with underscores in the version
          else
            VERSION=${{ github.sha }}
            VERSION=g${VERSION:0:8}
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo $VERSION

          OWNER=${{ github.repository_owner }}
          FULLNAME=${{ github.repository }}
          PROJECT_NAME=${FULLNAME#"$OWNER/"}
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo $PROJECT_NAME

          REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          echo "REPOSITORY_URL=$REPOSITORY_URL" >> "$GITHUB_OUTPUT"
          echo $REPOSITORY_URL

  Build:
    needs: [ Vars ]
    env:
      # A simple way to spread several environments for Windows. But to be more precise, we need to somehow add different envs to matrix.include

      MSYSTEM: UCRT64  # Ref: https://www.msys2.org/docs/environments/
      CHERE_INVOKING: 'yes'
      MSYS: 'winsymlinks:native'
    strategy:
      fail-fast: false
      matrix:
        # Naming MinGW platforms: https://sourceforge.net/p/mingw-w64/wiki2/TypeTriplets/
        platform:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-w64-mingw32
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        target: [xtensa-softmmu, riscv32-softmmu]

        include:
          - platform: x86_64-linux-gnu
            runs_on: ubuntu-22.04
            # eink-qemu: Debian 11's security archive is gone; Debian 12 (glibc 2.36)
            container: debian:12
            shell: bash -e {0}
            run_prerequisites: "./.github/workflows/scripts/prerequisites-native.sh"
            run_configure: "./.github/workflows/scripts/configure-native.sh"

          - platform: aarch64-linux-gnu
            runs_on: ubuntu-22.04
            # eink-qemu: Debian 11's security archive is gone; Debian 12 (glibc 2.36)
            container: debian:12
            shell: bash -e {0}
            run_prerequisites: "./.github/workflows/scripts/prerequisites-cross-linux-arm64.sh"
            run_configure: "./.github/workflows/scripts/configure-cross-linux-arm64.sh"

          - platform: x86_64-w64-mingw32
            runs_on: windows-2022
            shell: msys2 {0}
            run_configure: "./.github/workflows/scripts/configure-win.sh"

          - platform: x86_64-apple-darwin
            runs_on: macos-15-intel
            shell: bash -e {0}
            run_prerequisites: "./.github/workflows/scripts/prerequisites-macos.sh"
            run_configure: "./.github/workflows/scripts/configure-macos.sh"

          - platform: aarch64-apple-darwin
            runs_on: macos-14
            shell: bash -e {0}
            run_prerequisites: "./.github/workflows/scripts/prerequisites-macos.sh"
            run_configure: "./.github/workflows/scripts/configure-macos.sh"

    runs-on: ${{ matrix.runs_on }}
    container:
        image: ${{ matrix.container }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v6

      - name: Install prerequisites (${{ matrix.target }} @ ${{ matrix.platform }})
        if : ${{ matrix.platform != 'x86_64-w64-mingw32' }}
        run: |
          ${{ matrix.run_prerequisites }}

      - name: Install MSYS2 prerequisites (${{ matrix.target }} @ ${{ matrix.platform }})
        if : ${{ matrix.platform == 'x86_64-w64-mingw32' }}
        uses: msys2/setup-msys2@v2
        with:
          cache: true
          msystem: UCRT64
          install: >-
            diffutils
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-libgcrypt
            mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libslirp
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-SDL2

      - name: Configure (${{ matrix.target }} @ ${{ matrix.platform }})
        env:
          VERSION: ${{ needs.Vars.outputs.VERSION }}
          TARGET: ${{ matrix.target }}
        run: |
          ${{ matrix.run_configure }}

      - name: Build (${{ matrix.target }} @ ${{ matrix.platform }})
        run: |
          ninja -C build install

      - name: Test Windows generated-code jumps
        if: matrix.platform == 'x86_64-w64-mingw32'
        run: |
          ninja -C build tests/unit/test-win32-sigjump.exe
          ./build/pyvenv/bin/meson test -C build --print-errorlogs test-win32-sigjump

      - name: Install the heaptrace plugin (${{ matrix.target }} @ ${{ matrix.platform }})
        run: |
          # eink-qemu: the heap view's allocation tracer (contrib/plugins/heaptrace.c),
          # for heapview.py and the desktop app; QEMU does not install contrib plugins.
          mkdir -p install/qemu/plugins
          for f in build/contrib/plugins/libheaptrace.so build/contrib/plugins/libheaptrace.dylib build/contrib/plugins/libheaptrace.dll; do
            if [ -f "$f" ]; then cp -v "$f" install/qemu/plugins/; fi
          done
          ls install/qemu/plugins/libheaptrace.*

      - name: Smoke test (${{ matrix.target }} @ ${{ matrix.platform }})
        if : ${{ matrix.platform == 'x86_64-linux-gnu' }}
        run: |
          # eink-qemu: the board machines must come up (no firmware: blank flash spins in the ROM)
          head -c 16777216 /dev/zero > blank.bin
          if [ "${{ matrix.target }}" = xtensa-softmmu ]; then bin=qemu-system-xtensa; m=x4pro; else bin=qemu-system-riscv32; m=x3; fi
          set +e
          timeout 10 install/qemu/bin/$bin -machine $m -display none -serial null -monitor none \
            -drive file=blank.bin,if=mtd,format=raw -nic user,model=esp32_wifi
          rc=$?
          [ $rc = 124 ] || { echo "machine $m exited with $rc"; exit 1; }

      - name: Bundle Windows DLLs (${{ matrix.target }} @ ${{ matrix.platform }})
        if : ${{ matrix.platform == 'x86_64-w64-mingw32' }}
        run: |
          ./.github/workflows/scripts/bundle-win-dlls.sh install/qemu/bin

      - name: Package (${{ matrix.target }} @ ${{ matrix.platform }})
        env:
          VERSION: ${{ needs.Vars.outputs.VERSION }}
          PROJECT_NAME: ${{ needs.Vars.outputs.PROJECT_NAME }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          find $PWD/install/qemu/share/qemu/ -maxdepth 1 -mindepth 1 -not -name 'esp*.bin' -exec rm -rfv {} \;
          cp -R eink-qemu README.md EINK-QEMU.md install/qemu/   # eink-qemu: run.sh/drive.py find bin/ next to them
          export DIST_DIR=${PWD}/dist
          mkdir -p ${DIST_DIR}
          cd $PWD/install
          ARCHIVE_NAME=${PROJECT_NAME}-${TARGET}-${VERSION}-${PLATFORM}.tar.xz
          tar -cJvf ${DIST_DIR}/${ARCHIVE_NAME} qemu > ${DIST_DIR}/dist-filelist-${TARGET}-${PLATFORM}.txt 2>&1
          echo "dist/dist-qemu-${TARGET}-${PLATFORM}/${ARCHIVE_NAME}" > ${DIST_DIR}/file_${PLATFORM}_${TARGET}

      - name: Save build/build.ninja for failed builds
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-ninja-${{ matrix.target }}-${{ matrix.platform }}
          path: build/build.ninja

      - name: Dist filelist (dbg) (${{ matrix.target }} @ ${{ matrix.platform }})
        uses: actions/upload-artifact@v7
        with:
          name: dist-filelist-${{ matrix.target }}-${{ matrix.platform }}
          path: |
            dist/dist-filelist-*

      - name: Dist artifacts (${{ matrix.target }} @ ${{ matrix.platform }})
        uses: actions/upload-artifact@v7
        with:
          name: dist-qemu-${{ matrix.target }}-${{ matrix.platform }}
          path: |
            dist/

  # eink-qemu: the desktop app's generated inputs (boot assets, turbo
  # overrides), made once on Linux for every desktop build.
  desktop-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare resources
        run: sh eink-qemu/desktop/scripts/prepare-resources.sh
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-resources
          path: |
            eink-qemu/desktop/public/boot
            eink-qemu/desktop/src-tauri/resources
          if-no-files-found: error

  # eink-qemu: the Tauri desktop app, bundling the QEMU the Build job made for
  # the same platform. Linux is not packaged yet.
  desktop:
    needs: [ Vars, Build, desktop-resources ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: aarch64-apple-darwin
            runs_on: macos-14
            qemu_platform: aarch64-apple-darwin
          - platform: x86_64-apple-darwin
            runs_on: macos-15-intel
            qemu_platform: x86_64-apple-darwin
          - platform: x86_64-pc-windows-msvc
            runs_on: windows-2022
            qemu_platform: x86_64-w64-mingw32
    runs-on: ${{ matrix.runs_on }}
    defaults:
      run:
        shell: bash
        working-directory: eink-qemu/desktop
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: desktop-resources
          path: eink-qemu/desktop

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-qemu-*-${{ matrix.qemu_platform }}
          path: qemu-dist
          merge-multiple: true

      - name: Unpack QEMU
        run: |
          mkdir -p ../../qemu-install
          for archive in ../../qemu-dist/*.tar.xz; do tar -xJf "$archive" -C ../../qemu-install; done
          ls -l ../../qemu-install/qemu/bin

      # The macOS QEMU links Homebrew's libraries, which the bundle copies.
      - name: Install Homebrew libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          ../../.github/workflows/scripts/prerequisites-macos.sh
          brew install dosfstools   # fsck.fat for the SD tests

      - name: Stage QEMU (macOS)
        if: runner.os == 'macOS'
        run: EINK_QEMU_BUILD="$PWD/../../qemu-install/qemu/bin" sh scripts/bundle-qemu.sh

      - name: Stage QEMU (Windows)
        if: runner.os == 'Windows'
        run: sh scripts/bundle-qemu-windows.sh ../../qemu-install/qemu

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: dtolnay/rust-toolchain@stable

      - name: Install front-end dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: |
          pnpm exec tsc --noEmit
          cargo test --manifest-path src-tauri/Cargo.toml

      # The resources are prepared already, so only the front end is built.
      - name: Build
        run: |
          case "$RUNNER_OS" in Windows) bundles=nsis ;; *) bundles=dmg ;; esac
          pnpm tauri build --bundles "$bundles" \
            --config src-tauri/tauri.bundle.conf.json \
            --config '{"build":{"beforeBuildCommand":"pnpm build:web"}}'

      - name: Package
        env:
          VERSION: ${{ needs.Vars.outputs.VERSION }}
          PROJECT_NAME: ${{ needs.Vars.outputs.PROJECT_NAME }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            source=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
            name=${PROJECT_NAME}-desktop-${VERSION}-${PLATFORM}-setup.exe
          else
            source=$(ls src-tauri/target/release/bundle/dmg/*.dmg)
            name=${PROJECT_NAME}-desktop-${VERSION}-${PLATFORM}.dmg
          fi
          mkdir -p ../../dist
          cp "$source" "../../dist/$name"
          echo "dist/dist-desktop-${PLATFORM}/${name}" > "../../dist/file_desktop_${PLATFORM}"
          ls -l ../../dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-desktop-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  Upload:
    if: startsWith(github.ref, 'refs/tags/')
    # eink-qemu: the browser build and its smoke test, and the desktop app, must pass too
    needs: [ Vars, Build, wasm, desktop ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps :
      # eink-qemu: changelog from commit subjects since the previous version tag.
      # GitHub's generated notes list merged pull requests, and this project
      # commits straight to main.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: notes-src   # kept apart: later steps search the workspace for file_*
      - name: Write the changelog
        working-directory: notes-src
        run: |
          prev=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            if [ -n "$prev" ]; then
              echo "## Changes since $prev"
              echo
              git log --no-merges --format='- %s (%h)' "$prev..$GITHUB_REF_NAME" | sed -E 's/^- (eink-qemu|x4prosim): /- /'
            else
              echo "First release."
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create a source archive
        id: create-source
        env:
          VERSION: ${{ needs.Vars.outputs.VERSION }}
          PROJECT_NAME: ${{ needs.Vars.outputs.PROJECT_NAME }}
          REPOSITORY_URL: ${{ needs.Vars.outputs.REPOSITORY_URL }}
        run: |
          export RELEASE_CHECKSUM_FILE="${PROJECT_NAME}-${VERSION}-checksum.sha256"
          echo "RELEASE_CHECKSUM_FILE=$RELEASE_CHECKSUM_FILE" >> "$GITHUB_OUTPUT"
          RELEASE_SRC_NAME="${PROJECT_NAME}-${VERSION}-src"
          export RELEASE_SRC_FILE="${PROJECT_NAME}-${VERSION}-src.tar.xz"
          echo "RELEASE_SRC_FILE=$RELEASE_SRC_FILE" >> "$GITHUB_OUTPUT"

          rm -rf -- "${RELEASE_SRC_NAME}" "${RELEASE_SRC_FILE}"
          git clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" --recurse-submodules --shallow-submodules "${REPOSITORY_URL}" "${RELEASE_SRC_NAME}"
          find "${RELEASE_SRC_NAME}" -name ".git" -type d -exec rm -rf -- "{}" +
          find "${RELEASE_SRC_NAME}" -name .git\* -exec rm -rf -- {} +
          tar -cJvf "${RELEASE_SRC_FILE}" "${RELEASE_SRC_NAME}" > src-filelist.txt 2>&1
          rm -rf -- "${RELEASE_SRC_NAME}"
          ls -l

      - name: Source filelist (dbg)
        uses: actions/upload-artifact@v7
        with:
          name: src-filelist
          path: |
            src-filelist.txt

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-qemu-*
          path: dist

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-desktop-*
          path: dist

      - name: Create a checksum file
        env:
          RELEASE_CHECKSUM_FILE: ${{ steps.create-source.outputs.RELEASE_CHECKSUM_FILE }}
          RELEASE_SRC_FILE: ${{ steps.create-source.outputs.RELEASE_SRC_FILE }}
        run: |
          ls -l
          DIST_FILE_LIST=$(find . -name file_\* -exec cat {} \+)
          DIST_FILE_LIST="${DIST_FILE_LIST} ${RELEASE_SRC_FILE}"
          RELEASE_CHECKSUM_FILE=$(realpath "${RELEASE_CHECKSUM_FILE}")
          for n in $DIST_FILE_LIST; do
            # Release archives might be in subdirectories, but we need just the file names in the checksum file
            n_dir=$(dirname "${n}")
            n_file=$(basename "${n}")
            pushd "${n_dir}" > /dev/null
            sz=$(stat -c%s "${n_file}")
            printf "# %s: %s bytes\n" "${n_file}" "${sz}" >> "${RELEASE_CHECKSUM_FILE}"
            sha256sum -b "${n_file}" >> "${RELEASE_CHECKSUM_FILE}"
            popd > /dev/null
          done
          DIST_FILE_LIST="${DIST_FILE_LIST} ${RELEASE_CHECKSUM_FILE}"
          # remove new lines from file list
          DIST_FILE_LIST="${DIST_FILE_LIST//$'\n'/ }"
          cat "${RELEASE_CHECKSUM_FILE}"
          rm -rf -- upload && mkdir -p upload && mv -v ${DIST_FILE_LIST} upload/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # eink-qemu: tags with a suffix (0.2.0-rc1) are pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: upload/*

  wasm:
    needs: [ Vars ]
    outputs:
      pages_branch: ${{ env.WASM_PAGES_BRANCH }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EMSDK_VERSION: '6.0.12'
      JOBS: '2'
    steps:
      - uses: actions/checkout@v6
      - name: Install host build tools
        run: |
          sudo apt-get update
          # libltdl-dev supplies ltdl.m4 (LT_SYS_SYMBOL_USCORE) for libffi's autoreconf
          sudo apt-get install -y build-essential autoconf automake libtool libltdl-dev \
            pkg-config ninja-build meson python3-venv texinfo gettext \
            dosfstools mtools cmake openssl curl
      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - name: Test browser FAT filesystem
        run: node eink-qemu/wasm/web/fat.test.mjs
      - name: Test reproducible SD images
        run: python3 -m unittest eink-qemu.tests.test_mksd
      - name: Test Wi-Fi asset preparation and packaging
        run: python3 -m unittest discover -s eink-qemu/wasm -p test_wifi_assets.py
      - name: Cache wasm dependencies
        uses: actions/cache@v5
        with:
          path: |
            build-wasm-deps/sysroot-wasm64
            build-wasm-deps/em-cache
          key: wasm64-${{ runner.os }}-${{ runner.arch }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('eink-qemu/wasm/build-deps.sh', 'eink-qemu/wasm/cross.meson') }}
      - name: Build dependencies
        run: eink-qemu/wasm/build-deps.sh
      - name: Build and package wasm
        env:
          VERSION: ${{ needs.Vars.outputs.VERSION }}
        run: eink-qemu/wasm/build.sh --web --with-pkgversion="$VERSION"
      - name: Test browser Wi-Fi TCP and TLS downloads
        run: node --test eink-qemu/wasm/test-browser-network.mjs
      - name: Smoke test without firmware
        run: eink-qemu/wasm/smoke.sh --rom-only
      - name: Check Pages isolation assets
        run: |
          test -s build-wasm-32limit/web-dist/coi-serviceworker.js
          test -s build-wasm-32limit/web-dist/coi-serviceworker.LICENSE.txt
      - name: Upload wasm package
        uses: actions/upload-artifact@v7
        with:
          name: eink-qemu-${{ needs.Vars.outputs.VERSION }}-wasm
          path: build-wasm-32limit/web-dist
          if-no-files-found: error
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-smoke-${{ needs.Vars.outputs.VERSION }}
          path: build-wasm/evidence/smoke
          if-no-files-found: warn
      - name: Upload Pages artifact
        if: github.ref == format('refs/heads/{0}', env.WASM_PAGES_BRANCH) && github.event_name == 'push' && github.repository == 'serialx/eink-qemu'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build-wasm-32limit/web-dist

  deploy-wasm:
    needs: wasm
    if: github.ref == format('refs/heads/{0}', needs.wasm.outputs.pages_branch) && github.event_name == 'push' && github.repository == 'serialx/eink-qemu'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: wasm-pages
      cancel-in-progress: false
    steps:
      - name: Deploy emulator page
        id: deployment
        uses: actions/deploy-pages@v4
