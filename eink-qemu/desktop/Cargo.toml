# eink-qemu desktop workspace: the Tauri app, the emulator core it shares
# with the command-line tool, and that tool.
[workspace]
members = ["src-tauri", "core", "cli", "bridge"]
resolver = "2"

[workspace.package]
version = "0.9.1"
edition = "2021"
rust-version = "1.89"

# fatfs 0.3.6 with eink-qemu fixes (core/vendor/fatfs/EINK-QEMU.md): folders it
# creates are valid FAT, and new FAT32 root clusters are zeroed.
[patch.crates-io]
fatfs = { path = "core/vendor/fatfs" }

# SD card edits run in the core crate and fatfs; keep debug builds responsive.
[profile.dev.package.eink-core]
opt-level = 2

[profile.dev.package.fatfs]
opt-level = 3

# Choosing a firmware hashes its ELF (often 80 MB) to match the two.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
