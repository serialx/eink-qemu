[package]
name = "eink-qemu-cli"
description = "eink-qemu's command-line tool: scripted, headless runs of e-ink reader firmware, heap profiling and paired comparisons"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "eink-qemu"
path = "src/main.rs"

[dependencies]
eink-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "net", "io-util", "sync", "time", "macros", "rt-multi-thread", "fs", "signal"] }
regex = "1"
png = "0.17"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
