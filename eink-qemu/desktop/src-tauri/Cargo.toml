[package]
name = "eink-qemu-desktop"
version = "0.6.0"
description = "eink-qemu desktop: native QEMU with the browser page's interface"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "eink_qemu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
eink-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["process", "net", "io-util", "sync", "time", "macros", "rt-multi-thread", "fs", "signal"] }
dunce = "1"
