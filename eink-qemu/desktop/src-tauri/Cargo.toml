[package]
name = "eink-qemu-desktop"
version = "0.1.0"
description = "eink-qemu desktop: native QEMU with the browser page's interface"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
name = "eink_qemu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "net", "io-util", "sync", "time", "macros", "rt-multi-thread", "fs"] }
fatfs = "0.3.6"
fscommon = "0.1.1"
flate2 = "1"
tempfile = "3"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
codegen-units = 1
lto = true
