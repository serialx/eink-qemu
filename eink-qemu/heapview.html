<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heap view</title>
<link rel="stylesheet" href="heapview.css">
</head>
<body>
<script type="module">
import { mount } from "./heapview.js";
const get = (path) => fetch(path, { cache: "no-store" }).then((r) => r.json());
mount(document.body, {
  snapshot: () => get("/snapshot"),
  history: () => get("/history"),
  events: (gen, start, stacks, sites) => get(`/events?gen=${gen}&start=${start}&stacks=${stacks}&sites=${sites}`),
  stack: (id) => get(`/stack?id=${id}`),
});
</script>
</body>
</html>
